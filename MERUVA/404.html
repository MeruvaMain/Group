*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--paper);color:var(--ink);font-family:var(--disp);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:2rem;overflow:hidden;position:relative;
}
.glow{position:absolute;top:-250px;left:50%;transform:translateX(-50%);width:800px;height:800px;background:radial-gradient(circle,rgba(182,78,58,.07),transparent 60%);pointer-events:none}
.mountain{position:absolute;bottom:0;left:0;right:0;height:38vh;pointer-events:none;opacity:.5}
.code{
  font-family:var(--wm),serif;font-weight:300;
  font-size:clamp(7rem,22vw,14rem);line-height:1;letter-spacing:-.02em;
  background:linear-gradient(135deg,#E4694F,#B64E3A,#8F2718);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  position:relative;z-index:2;
}
h1{font-family:var(--wm),serif;font-weight:500;font-style:italic;font-size:clamp(1.4rem,4vw,2rem);color:var(--ink);margin:1rem 0 .8rem;position:relative;z-index:2}
p{font-size:.95rem;color:var(--ink-soft);line-height:1.8;max-width:420px;position:relative;z-index:2}
.btn{
  display:inline-flex;align-items:center;gap:.8rem;margin-top:2.5rem;
  padding:1.05rem 2.2rem;background:var(--shu);color:#fff;text-decoration:none;
  font-size:.68rem;letter-spacing:.25em;text-transform:uppercase;font-weight:600;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 100%,0 100%);
  transition:all .35s;border:1px solid var(--shu);position:relative;z-index:2;
}
.btn:hover{background:transparent;color:var(--shu)}
/* chữ nhỏ nên dùng --shu-text (4.60:1); --shu gốc chỉ được 4.46 */
.tag{font-size:.6rem;letter-spacing:.4em;text-transform:uppercase;color:var(--shu-text,#B64A35);margin-bottom:1.5rem;position:relative;z-index:2}
