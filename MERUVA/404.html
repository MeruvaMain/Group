<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Lạc đường trên núi · MERUVA</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/logo-mark.png">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&family=Inter:wght@400;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&family=Inter:wght@400;600&display=swap"></noscript>
<style>
:root{--black:#0A0A0A;--gold:#D4A437;--cream:#F5F0E6;--silver:#C0C0C8;--silver-soft:#888890;--line:rgba(212,164,55,.18)}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--black);color:var(--cream);font-family:'Inter',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:2rem;overflow:hidden;position:relative;
}
.glow{position:absolute;top:-250px;left:50%;transform:translateX(-50%);width:800px;height:800px;background:radial-gradient(circle,rgba(212,164,55,.07),transparent 60%);pointer-events:none}
.mountain{position:absolute;bottom:0;left:0;right:0;height:38vh;pointer-events:none;opacity:.5}
.code{
  font-family:'Cormorant Garamond',serif;font-weight:300;
  font-size:clamp(7rem,22vw,14rem);line-height:1;letter-spacing:-.02em;
  background:linear-gradient(135deg,#F0C860,#D4A437,#A07820);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  position:relative;z-index:2;
}
h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-style:italic;font-size:clamp(1.4rem,4vw,2rem);color:var(--cream);margin:1rem 0 .8rem;position:relative;z-index:2}
p{font-size:.95rem;color:var(--silver-soft);line-height:1.8;max-width:420px;position:relative;z-index:2}
.btn{
  display:inline-flex;align-items:center;gap:.8rem;margin-top:2.5rem;
  padding:1.05rem 2.2rem;background:var(--gold);color:var(--black);text-decoration:none;
  font-size:.68rem;letter-spacing:.25em;text-transform:uppercase;font-weight:600;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 100%,0 100%);
  transition:all .35s;border:1px solid var(--gold);position:relative;z-index:2;
}
.btn:hover{background:transparent;color:var(--gold)}
.tag{font-size:.6rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-bottom:1.5rem;position:relative;z-index:2}
</style>
</head>
<body>
<div class="glow"></div>
<div class="tag">MERUVA · From the summit, we serve.</div>
<div class="code">404</div>
<h1>Bạn đã lạc đường trên núi.</h1>
<p>Trang này không tồn tại hoặc đã được dời đi. Đỉnh núi vẫn ở đó — quay lại con đường chính nhé.</p>
<a class="btn" href="/">Về trang chủ →</a>
<div class="mountain">
  <svg viewBox="0 0 1440 400" preserveAspectRatio="none" fill="none" style="width:100%;height:100%">
    <path d="M0 400 L200 200 L360 300 L500 100 L640 280 L720 60 L800 280 L940 100 L1080 300 L1240 180 L1440 400 Z" fill="rgba(212,164,55,.05)"/>
    <path d="M0 400 L200 200 L360 300 L500 100 L640 280 L720 60 L800 280 L940 100 L1080 300 L1240 180 L1440 400" stroke="rgba(212,164,55,.12)" stroke-width="1"/>
  </svg>
</div>
</body>
</html>
