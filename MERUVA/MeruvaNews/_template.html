<!DOCTYPE html>
<!-- ╔══════════════════════════════════════════════════════════════╗
     ║  FILE NÀY ĐƯỢC SINH TỰ ĐỘNG bởi build.js — ĐỪNG SỬA TRỰC TIẾP ║
     ║  Sửa nội dung trong  content/<bảng-tin>/posts/*.post          ║
     ║  rồi chạy:  node build.js                                     ║
     ╚══════════════════════════════════════════════════════════════╝ -->
<html lang="%LANG%">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>%PAGE_TITLE%</title>
<meta name="description" content="%META_DESC%">
<meta name="author" content="Phạm Duy Kha (Bin) — MERUVA">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0A0A0A">
<link rel="canonical" href="%CANONICAL%">

<meta property="og:type" content="website">
<meta property="og:url" content="%CANONICAL%">
<meta property="og:title" content="%PAGE_TITLE%">
<meta property="og:description" content="%OG_DESC%">
<meta property="og:image" content="%OG_IMAGE%">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="%OG_LOCALE%">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="%PAGE_TITLE%">
<meta name="twitter:description" content="%OG_DESC%">
<meta name="twitter:image" content="%OG_IMAGE%">
%HREFLANG%

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700;800&display=swap"></noscript>
<link rel="icon" type="image/png" href="../logo-mark.png">
<link rel="apple-touch-icon" href="../logo-mark.png">
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../meruva-shared.css?v=6">
<link rel="stylesheet" href="Main_news.css?v=3">

%JSONLD%
</head>
<body class="subpage">

<div id="cursor"></div>
<div id="cursor-ring"></div>
<div id="lang-overlay"></div>
<div id="read-progress"></div>

<img class="wm" src="../logo-mark.png" alt="" aria-hidden="true">

<nav id="nav">
  <a href="../index.html" class="logo-wrap">
    <img class="logo-mark" src="../logo-mark.png" alt="MERUVA" style="mix-blend-mode:screen">
    <div class="logo-text">MERUVA</div>
  </a>
  <div class="nav-right">
    <div class="lang-switcher">
%LANG_SWITCHER%
    </div>
  </div>
</nav>

<div id="floating-back"><a href="../index.html">%BACK_LABEL%</a></div>

<div class="jr-wrap">

  <!-- ════ HEADER ════ -->
  <header class="jr-head">
    <div class="jr-kicker">%KICKER%</div>
    <h1 class="jr-title">%TITLE_HTML%</h1>
    <p class="jr-intro">%INTRO_HTML%</p>
  </header>

  <!-- ════ TIMELINE — tự render từ các bài bên dưới ════ -->
  <section class="jr-timeline" id="jrTimeline"></section>
</div>

<!-- ╔══════════════════════════════════════════════════════════════╗
     ║  KHO BÀI VIẾT (sinh tự động) — nội dung tĩnh cho Google index ║
     ║  ĐỪNG sửa ở đây. Sửa file .post rồi chạy: node build.js       ║
     ╚══════════════════════════════════════════════════════════════╝ -->
<div id="posts" class="post-store">
%POSTS%
</div>
<!-- ══════ HẾT KHO BÀI VIẾT ══════ -->

<footer class="jr-foot">
  <p>%FOOTER_HTML%</p>
</footer>

<!-- ════ POPUP BÀI ĐĂNG — kính lỏng mờ ════ -->
<div id="article-overlay" class="art-overlay" aria-hidden="true">
  <article class="art-modal" role="dialog" aria-modal="true" aria-labelledby="artTitle">
    <span class="art-accent" id="artAccent" aria-hidden="true"></span>
    <button class="art-close" type="button" aria-label="%CLOSE_LABEL%">✕</button>
    <div class="art-scroll">
      <header class="art-head">
        <div class="art-kicker" id="artKicker"></div>
        <h2 class="art-title" id="artTitle"></h2>
      </header>
      <div class="art-content" id="artContent"></div>
      <footer class="art-foot" id="artFoot"></footer>
    </div>
  </article>
</div>

<!-- Đồng bộ ngôn ngữ toàn site theo ngôn ngữ của trang này -->
<script>try{localStorage.setItem('meruva_lang','%LANG%');}catch(e){}</script>
<script src="../meruva_lang.js?v=6"></script>
<script src="../meruva-shared.js?v=2"></script>
<script src="Main_news.js?v=4"></script>
</body>
</html>
